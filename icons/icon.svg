<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="terciopelo" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#5a1670"/>
      <stop offset="0.55" stop-color="#2a0838"/>
      <stop offset="1" stop-color="#0d0212"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7c7"/>
      <stop offset="0.25" stop-color="#f7d354"/>
      <stop offset="0.5" stop-color="#c4881a"/>
      <stop offset="0.72" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#9c6508"/>
    </linearGradient>
    <linearGradient id="oroVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#e9b937"/>
      <stop offset="1" stop-color="#8f5a06"/>
    </linearGradient>
    <radialGradient id="plato" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3b0d4d"/>
      <stop offset="1" stop-color="#140419"/>
    </radialGradient>
    <radialGradient id="rubi" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff9aa8"/>
      <stop offset="0.5" stop-color="#e0103a"/>
      <stop offset="1" stop-color="#6e0018"/>
    </radialGradient>
    <radialGradient id="esmeralda" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#b6ffd8"/>
      <stop offset="0.5" stop-color="#11b863"/>
      <stop offset="1" stop-color="#03502a"/>
    </radialGradient>
    <radialGradient id="zafiro" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#c2d8ff"/>
      <stop offset="0.5" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#0a2378"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="destello" d="M0 -24 C3 -6 6 -3 24 0 C6 3 3 6 0 24 C-3 6 -6 3 -24 0 C-6 -3 -3 -6 0 -24 Z"/>
    <path id="diamante" d="M0 -14 L11 0 L0 14 L-11 0 Z"/>

    <!-- Pistola dorada en horizontal, cañón hacia +x; la culata queda cerca del origen (tapada por el plato) -->
    <g id="pistola" stroke="#6b4204" stroke-width="2.5" stroke-linejoin="round">
      <path d="M62 18 L104 18 L94 92 Q92 100 84 100 L56 100 Q46 100 48 90 Z" fill="url(#oroVertical)"/>
      <rect x="60" y="8" width="120" height="14" rx="3" fill="url(#oro)"/>
      <path d="M104 22 Q106 48 128 46 Q142 44 140 22" fill="none" stroke-width="6"/>
      <path d="M118 22 Q116 34 122 38" fill="none" stroke-width="4"/>
      <rect x="52" y="-26" width="14" height="14" rx="3" fill="url(#oroVertical)"/>
      <rect x="60" y="-18" width="180" height="30" rx="5" fill="url(#oro)"/>
      <rect x="232" y="-14" width="14" height="22" rx="3" fill="#8f5a06"/>
      <rect x="224" y="-25" width="7" height="8" rx="1" fill="url(#oroVertical)"/>
      <g stroke="#7a4c05" stroke-width="2">
        <line x1="76" y1="-13" x2="76" y2="7"/><line x1="83" y1="-13" x2="83" y2="7"/>
        <line x1="90" y1="-13" x2="90" y2="7"/><line x1="97" y1="-13" x2="97" y2="7"/>
      </g>
      <circle cx="73" cy="60" r="8" fill="url(#rubi)" stroke="#fff3b0" stroke-width="2"/>
    </g>

    <clipPath id="recorte"><rect width="512" height="512" rx="112"/></clipPath>
    <radialGradient id="rayoBrillo" cx="256" cy="280" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a0" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f2c23a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b8790c" stop-opacity="0.1"/>
    </radialGradient>
    <path id="rayo" d="M256 280 L236 -60 L276 -60 Z"/>

    <!-- Moneda de oro centrada en el origen -->
    <g id="moneda" stroke="#6b4204" stroke-width="2.5">
      <circle r="22" fill="url(#oro)"/>
      <circle r="16" fill="none" stroke="#fff3b0" stroke-width="2" opacity="0.8"/>
      <path d="M0 -10 L3 -3 L10 -3 L4.5 1.5 L6.5 9 L0 4.5 L-6.5 9 L-4.5 1.5 L-10 -3 L-3 -3 Z" fill="#a8700f" stroke="none"/>
    </g>

    <!-- Guitarra flamenca: origen en el centro de la caja, mástil hacia -y -->
    <g id="guitarra" stroke="#6b4204" stroke-width="2.5" stroke-linejoin="round">
      <rect x="-6" y="-122" width="12" height="104" fill="url(#oroVertical)"/>
      <rect x="-9" y="-146" width="18" height="28" rx="3" fill="url(#oro)"/>
      <g fill="#fff3b0" stroke="none">
        <circle cx="-12" cy="-140" r="3"/><circle cx="-12" cy="-130" r="3"/><circle cx="-12" cy="-120" r="3"/>
        <circle cx="12" cy="-140" r="3"/><circle cx="12" cy="-130" r="3"/><circle cx="12" cy="-120" r="3"/>
      </g>
      <path d="M0 -40 C-30 -42 -30 -8 -18 0 C-40 8 -40 50 0 50 C40 50 40 8 18 0 C30 -8 30 -42 0 -40 Z" fill="url(#oro)"/>
      <circle cy="-8" r="10" fill="#2a0838"/>
      <circle cy="-8" r="13" fill="none" stroke="#fff3b0" stroke-width="2"/>
      <rect x="-13" y="28" width="26" height="6" rx="2" fill="#8f5a06"/>
      <g stroke="#fff6c2" stroke-width="1">
        <line x1="-3" y1="-142" x2="-3" y2="30"/><line x1="0" y1="-142" x2="0" y2="30"/><line x1="3" y1="-142" x2="3" y2="30"/>
      </g>
      <g stroke="#7a4c05" stroke-width="1.5">
        <line x1="-6" y1="-104" x2="6" y2="-104"/><line x1="-6" y1="-88" x2="6" y2="-88"/>
        <line x1="-6" y1="-72" x2="6" y2="-72"/><line x1="-6" y1="-56" x2="6" y2="-56"/>
      </g>
    </g>

    <!-- Micrófono: origen en la unión cabeza-mango, cabeza hacia -y -->
    <g id="microfono" stroke="#6b4204" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-12 0 L12 0 L7 72 Q0 78 -7 72 Z" fill="url(#oroVertical)"/>
      <rect x="-24" y="-62" width="48" height="58" rx="24" fill="url(#oro)"/>
      <g stroke="#7a4c05" stroke-width="2">
        <line x1="-20" y1="-46" x2="20" y2="-46"/><line x1="-23" y1="-36" x2="23" y2="-36"/>
        <line x1="-23" y1="-26" x2="23" y2="-26"/><line x1="-20" y1="-16" x2="20" y2="-16"/>
      </g>
      <rect x="-26" y="-10" width="52" height="10" rx="3" fill="url(#oroVertical)"/>
      <circle cy="26" r="6" fill="url(#rubi)" stroke="#fff3b0" stroke-width="2"/>
    </g>

    <!-- Antorcha de soldar: origen en la unión mango-cuello, boquilla hacia +x/+y -->
    <g id="antorcha" stroke="#6b4204" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-62 2 C-72 6 -78 16 -84 24" fill="none" stroke="url(#oro)" stroke-width="8" stroke-linecap="round"/>
      <rect x="-62" y="-11" width="64" height="22" rx="9" fill="url(#oro)"/>
      <g stroke="#7a4c05" stroke-width="2">
        <line x1="-50" y1="-8" x2="-50" y2="8"/><line x1="-42" y1="-8" x2="-42" y2="8"/>
        <line x1="-34" y1="-8" x2="-34" y2="8"/><line x1="-26" y1="-8" x2="-26" y2="8"/>
      </g>
      <path d="M0 -7 L28 -7 Q42 -7 46 6 L50 18 L38 22 L34 10 Q31 5 26 5 L0 5 Z" fill="url(#oroVertical)"/>
      <path d="M36 20 L52 15 L60 36 L46 40 Z" fill="#8f5a06"/>
    </g>

    <!-- Lingote de oro centrado en el origen -->
    <g id="lingote" stroke="#6b4204" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-36 14 L36 14 L28 -12 L-28 -12 Z" fill="url(#oroVertical)"/>
      <path d="M-28 -12 L28 -12 L22 -20 L-22 -20 Z" fill="#fff1a8"/>
      <text x="0" y="6" font-family="Georgia, serif" font-size="11" font-weight="700"
            fill="#7a4c05" stroke="none" text-anchor="middle">999.9</text>
    </g>
  </defs>

  <!-- Fondo de terciopelo con marco dorado -->
  <rect width="512" height="512" rx="112" fill="url(#terciopelo)"/>

  <!-- Rayos de oro saliendo del plato -->
  <g clip-path="url(#recorte)" fill="url(#rayoBrillo)">
    <use href="#rayo"/>
    <use href="#rayo" transform="rotate(22.5 256 280)"/><use href="#rayo" transform="rotate(45 256 280)"/>
    <use href="#rayo" transform="rotate(67.5 256 280)"/><use href="#rayo" transform="rotate(90 256 280)"/>
    <use href="#rayo" transform="rotate(112.5 256 280)"/><use href="#rayo" transform="rotate(135 256 280)"/>
    <use href="#rayo" transform="rotate(157.5 256 280)"/><use href="#rayo" transform="rotate(180 256 280)"/>
    <use href="#rayo" transform="rotate(202.5 256 280)"/><use href="#rayo" transform="rotate(225 256 280)"/>
    <use href="#rayo" transform="rotate(247.5 256 280)"/><use href="#rayo" transform="rotate(270 256 280)"/>
    <use href="#rayo" transform="rotate(292.5 256 280)"/><use href="#rayo" transform="rotate(315 256 280)"/>
    <use href="#rayo" transform="rotate(337.5 256 280)"/>
  </g>

  <!-- Marco doble de oro -->
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="url(#oro)" stroke-width="16"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="url(#oro)" stroke-width="4"/>

  <!-- Purpurina -->
  <g fill="#ffe680" opacity="0.85">
    <circle cx="70" cy="190" r="3"/><circle cx="440" cy="250" r="3"/><circle cx="120" cy="460" r="2.5"/>
    <circle cx="395" cy="470" r="3"/><circle cx="460" cy="95" r="2.5"/><circle cx="55" cy="300" r="2"/>
    <circle cx="150" cy="70" r="2"/><circle cx="360" cy="60" r="2.5"/><circle cx="470" cy="330" r="2"/>
    <circle cx="200" cy="100" r="2"/><circle cx="320" cy="96" r="2.5"/><circle cx="180" cy="420" r="2"/>
    <circle cx="340" cy="415" r="2.5"/><circle cx="48" cy="420" r="2"/><circle cx="465" cy="410" r="2.5"/>
    <circle cx="90" cy="250" r="2"/><circle cx="425" cy="200" r="2"/>
  </g>

  <!-- Cadena de oro -->
  <circle cx="256" cy="280" r="168" fill="none" stroke="#5c3a03" stroke-width="22"/>
  <circle cx="256" cy="280" r="168" fill="none" stroke="url(#oro)" stroke-width="18"
          stroke-dasharray="22 9" stroke-linecap="round"/>
  <circle cx="256" cy="280" r="168" fill="none" stroke="#fff6c2" stroke-width="3"
          stroke-dasharray="10 21" opacity="0.7"/>

  <!-- Plato dorado -->
  <circle cx="256" cy="280" r="132" fill="url(#oro)"/>
  <circle cx="256" cy="280" r="118" fill="url(#plato)"/>
  <circle cx="256" cy="280" r="104" fill="none" stroke="url(#oro)" stroke-width="3" opacity="0.8"/>

  <!-- Tenedor y cuchillo cruzados -->
  <g fill="url(#oroVertical)" stroke="#6b4204" stroke-width="2" filter="url(#brillo)">
    <g transform="translate(256 290) rotate(-35)">
      <path d="M-28 -125 h8 v55 h8 v-55 h8 v55 h8 v-55 h8 v55 h8 v-55 h8 v65 c0 20 -12 32 -28 32 c-16 0 -28 -12 -28 -32 z"/>
      <rect x="-9" y="-36" width="18" height="140" rx="9"/>
    </g>
    <g transform="translate(256 290) rotate(35)">
      <path d="M-12 -125 c26 10 30 60 22 110 h-22 z"/>
      <rect x="-11" y="-17" width="22" height="121" rx="10"/>
    </g>
  </g>

  <!-- Brillantes engarzados en la cadena -->
  <g stroke="#fff3b0" stroke-width="2.5">
    <use href="#diamante" x="137" y="161" fill="url(#rubi)"/>
    <use href="#diamante" x="375" y="161" fill="url(#esmeralda)"/>
    <use href="#diamante" x="137" y="399" fill="url(#zafiro)"/>
    <use href="#diamante" x="375" y="399" fill="url(#rubi)"/>
    <use href="#diamante" x="88" y="280" fill="url(#esmeralda)"/>
    <use href="#diamante" x="424" y="280" fill="url(#zafiro)"/>
  </g>

  <!-- Pistolas a los lados, cañón arriba y culata hacia dentro -->
  <g filter="url(#brillo)">
    <use href="#pistola" transform="translate(92 432) rotate(-100) scale(0.8)"/>
    <use href="#pistola" transform="translate(420 432) rotate(100) scale(-0.8 0.8)"/>
  </g>

  <!-- Guitarra (arriba izquierda), micrófono (arriba derecha) y antorcha con chispas (abajo izquierda) -->
  <g filter="url(#brillo)">
    <use href="#guitarra" transform="translate(80 172) rotate(35) scale(0.75)"/>
    <use href="#microfono" transform="translate(436 150) rotate(-30) scale(0.8)"/>
    <use href="#antorcha" transform="translate(108 412) scale(1)"/>
  </g>
  <g filter="url(#brillo)">
    <g stroke="#ffd84a" stroke-width="3" stroke-linecap="round">
      <line x1="164" y1="452" x2="186" y2="472"/><line x1="164" y1="452" x2="192" y2="450"/>
      <line x1="164" y1="452" x2="180" y2="428"/><line x1="164" y1="452" x2="150" y2="478"/>
      <line x1="164" y1="452" x2="170" y2="482"/>
    </g>
    <g fill="#fffbe6">
      <use href="#destello" transform="translate(164 452) scale(0.6)"/>
      <use href="#destello" transform="translate(188 436) scale(0.3)"/>
      <use href="#destello" transform="translate(146 480) scale(0.25)"/>
    </g>
  </g>

  <!-- Monedas de oro -->
  <g filter="url(#brillo)">
    <use href="#moneda" transform="translate(356 476) scale(0.85)"/>
    <use href="#moneda" transform="translate(380 462) scale(0.7)"/>
  </g>

  <!-- Pila de lingotes -->
  <g filter="url(#brillo)">
    <use href="#lingote" x="218" y="466"/>
    <use href="#lingote" x="294" y="466"/>
    <use href="#lingote" x="256" y="436"/>
  </g>

  <!-- Corona -->
  <g filter="url(#brillo)">
    <path d="M176 150 L164 72 L212 112 L256 52 L300 112 L348 72 L336 150 Z"
          fill="url(#oroVertical)" stroke="#6b4204" stroke-width="3" stroke-linejoin="round"/>
    <rect x="172" y="142" width="168" height="24" rx="6" fill="url(#oro)" stroke="#6b4204" stroke-width="3"/>
    <circle cx="164" cy="70" r="11" fill="url(#zafiro)" stroke="#fff3b0" stroke-width="2"/>
    <circle cx="256" cy="50" r="13" fill="url(#rubi)" stroke="#fff3b0" stroke-width="2"/>
    <circle cx="348" cy="70" r="11" fill="url(#esmeralda)" stroke="#fff3b0" stroke-width="2"/>
    <circle cx="210" cy="154" r="7" fill="url(#esmeralda)"/>
    <circle cx="256" cy="154" r="8" fill="url(#rubi)"/>
    <circle cx="302" cy="154" r="7" fill="url(#zafiro)"/>
  </g>

  <!-- Destellos -->
  <g fill="#fffbe6" filter="url(#brillo)">
    <use href="#destello" transform="translate(196 38) scale(0.55)"/>
    <use href="#destello" transform="translate(318 36) scale(0.5)"/>
    <use href="#destello" transform="translate(318 238) scale(0.55)"/>
  </g>
</svg>
